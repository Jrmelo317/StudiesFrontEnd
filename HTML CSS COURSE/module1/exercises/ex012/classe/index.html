<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo esta hospedado no meu próprio servidor.</p>
    <video width="600px" poster="pictures/me-and-she.jpeg" preload="metadata" loop autoplay controls>
        <source src="videos/VideoEscada.mp4" type="video/mp4">
        <source src="videos/VideoEscada.webm" type="video/webm">
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos, baixe o arquivo mp4 por <a href="videos/VideoEscada.mp4" download="video.mp4" type="video/mp4">aqui</a>.</p>
    </video>
    <h1>Inserindo vídeos do Youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/OzUnqQk4eOg?si=S6PJyKhM68cv_rVP" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
