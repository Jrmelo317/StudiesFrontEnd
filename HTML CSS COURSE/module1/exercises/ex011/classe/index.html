<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
    <p>Tente abrir este site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho da aba do seu navegador.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="pictures/photop.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="pictures/photom.png" type="image/png">
        <img src="pictures/photog.png" alt="Imagem FLexível">
    </picture>
    <h2>Reproduzindo Aúdio</h2>
    <p>Vamos aprender a reproduzir aúdios em HTML5.</p>
    <audio preload="metadata" controls loop>
        <source src="sounds/WindyRoadBackToYouTheGreyRoomGoldenPalms.mp3" type="audio/mpeg">
        <source src="sounds/WindyRoadBackToYouTheGreyRoomGoldenPalms.ogg" type="audio/ogg">
        <source src="sounds/WindyRoadBackToYouTheGreyRoomGoldenPalms.wav" type="audio/wav">
        <p>Infelizmente seu nagador não consegue reproduzio aúdio, clique <a href="sounds/WindyRoadBackToYouTheGreyRoomGoldenPalms.mp3" download="audio.mp3" type="audio/mpeg">aqui</a> para baixar o arquivo mp3.</p>
    </audio>
</body>
</html>
