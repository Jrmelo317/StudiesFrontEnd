<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em casa caso.</p>
    <ul type="square">
        <li><dnf title="Use a tag &lt;p&gt;">Parágrafos</dnf></li>
        <li><dnf title="Use a tag &lt;h1&gt;">Títulos</dnf></li>
        <li><dnf title="Use a tag &lt;img&gt;">Imagens</dnf></li>
        <li><dnf title="Use a tag &lt;abbr&gt;">Abreviações</dnf></li>
        <li><dnf title="Use a tag &lt;code&gt;">Código-Fonte</dnf></li>
        <li><dnf title="Use a tag &lt;ol&gt;">Listas Ordenadas</dnf></li>
        <li><dnf title="Use a tag &lt;ul&gt;">Listas com demarcadores</dnf></li>
    </ul>
</body>
</html>
