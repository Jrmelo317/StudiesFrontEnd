<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradientes em CSS</title>
    <style>
        * { /* Configurações globais das CSS*/
            height: 100%;
        }
        body {
            background-image: linear-gradient(to right, #C6C3B6, #86A4B0, #4C595E, #3E587C, #8D553E, #A6513B, #D1B456);
            background-attachment: fixed;
        }
        h1 {
            color: white;
        }
    </style>
</head>
<body>
    <h1>Testando Gradientes</h1>
</body>
</html>
